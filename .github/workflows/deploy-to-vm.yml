name: Deploy to VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

# DEPLOY_HOST must be a host GitHub Actions can SSH to (not a Cloudflare orange-cloud
# hostname). Set via repo secret; never commit server IPs.
env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'deploy' }}
  # Serving directory on the VM. nginx serves this at https://sovereinia.org/guia/
  DEPLOY_PATH: "/srv/apps/sovereinia/guia/"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOST:-}" ]; then
            echo "DEPLOY_HOST secret is required (direct SSH host; not CF-proxied apex)"; exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SCAN_HOST="${DEPLOY_HOST##*@}"
          ssh-keyscan -H "$SCAN_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          if [ ! -s ~/.ssh/deploy_key ]; then
            echo "Private key is missing or empty"; exit 1
          fi

      - name: Deploy build to VM
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'deploy' }}
        run: |
          set -euo pipefail
          HOST="${DEPLOY_HOST##*@}"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            dist/ "${DEPLOY_USER}@${HOST}:${DEPLOY_PATH}"

      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://sovereinia.org/guia/)
          echo "GET /guia/ -> $code"
          test "$code" = "200"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
